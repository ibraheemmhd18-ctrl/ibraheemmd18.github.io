<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>mBlock IDE - Arduino Block Coding with Pin Categories | Full Arduino Uno Support</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Blockly Core -->
    <script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
    <!-- Blockly Arduino Generator (JavaScript) -->
    <script src="https://unpkg.com/blockly@10.4.3/php/source/arduino_generator.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #12131c;
            overflow: hidden;
            height: 100vh;
            color: #eef2ff;
        }

        /* Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            background: #1e1f2e;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            border-bottom: 1px solid #2d2f40;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #4c9aff, #a06eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo i {
            background: none;
            color: #4c9aff;
            margin-right: 6px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #2d2f42;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: #3b7bcb; }
        .btn-primary:hover { background: #2d62a8; transform: scale(1.02);}
        .btn-success { background: #2d9c6e; }
        .btn-success:hover { background: #248057; }
        .btn-warning { background: #e6a017; }
        .btn-danger { background: #c54545; }

        .port-status {
            background: #14151f;
            padding: 4px 14px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
        }
        .status-led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #5a5e7c;
            transition: 0.2s;
        }
        .status-led.active {
            background: #2ecc71;
            box-shadow: 0 0 6px #2ecc71;
        }
        select, button { font-family: inherit; }
        #portSelect {
            background: #0b0c14;
            color: white;
            border: 1px solid #3a3d5a;
            border-radius: 20px;
            padding: 4px 12px;
        }

        /* Workspace split */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .blockly-area {
            flex: 3;
            background: #1a1c28;
            position: relative;
            border-right: 1px solid #2a2c3e;
        }
        #blocklyDiv {
            height: 100%;
            width: 100%;
        }
        .console-panel {
            flex: 1.2;
            background: #12131c;
            display: flex;
            flex-direction: column;
        }
        .console-header {
            padding: 12px 16px;
            background: #1c1e2c;
            font-weight: 600;
            border-bottom: 1px solid #2a2c40;
            display: flex;
            justify-content: space-between;
        }
        .console-output {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            background: #0c0d16;
            white-space: pre-wrap;
        }
        .log-line { padding: 4px 0; border-bottom: 1px solid #1e1f2c; font-family: monospace; }
        .log-error { color: #ff8a7a; }
        .log-success { color: #8effb2; }
        .log-info { color: #7bc5ff; }

        @media (max-width: 750px) {
            .workspace { flex-direction: column; }
            .console-panel { min-height: 200px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="toolbar">
        <div class="logo"><i class="fas fa-microchip"></i> mBlock IDE · Arduino Uno</div>
        <div class="btn-group">
            <button id="compileBtn" class="btn btn-primary"><i class="fas fa-code-branch"></i> Compile & Verify</button>
            <button id="uploadBtn" class="btn btn-success"><i class="fas fa-upload"></i> Upload to COM</button>
            <button id="clearConsoleBtn" class="btn"><i class="fas fa-eraser"></i> Clear</button>
        </div>
        <div class="port-status">
            <span class="status-led" id="portLed"></span>
            <span id="portLabel">No Port</span>
            <select id="portSelect" style="border-radius:30px;"></select>
            <button id="refreshPortsBtn" class="btn" style="padding:4px 10px;"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>
    <div class="workspace">
        <div class="blockly-area">
            <div id="blocklyDiv"></div>
        </div>
        <div class="console-panel">
            <div class="console-header">
                <span><i class="fas fa-terminal"></i> Output & Compiler Log</span>
                <span id="compileStatusBadge" style="font-size:0.7rem; background:#25273a; padding:2px 8px; border-radius:30px;">Ready</span>
            </div>
            <div class="console-output" id="consoleOutput">
                <div class="log-line log-info">⚡ mBlock IDE Ready | Arduino Uno (ATmega328P)</div>
                <div class="log-line log-info">📦 Blocks with full pin categories: Digital, Analog, PWM, Serial</div>
                <div class="log-line log-info">🔌 Connect Arduino Uno, select COM port, then compile & upload.</div>
            </div>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. DEFINE CUSTOM ARDUINO BLOCKS WITH PIN CATEGORIES
    //    Digital Pins: 0-13, Analog Pins: A0-A5, PWM: 3,5,6,9,10,11
    // --------------------------------------------------------------
    Blockly.Blocks['arduino_pin_mode'] = {
        init: function() {
            this.appendDummyInput()
                .appendField("pin mode")
                .appendField(new Blockly.FieldDropdown([["LED_BUILTIN (13)","13"], ["D2","2"], ["D3","3"], ["D4","4"], ["D5","5"], ["D6","6"], ["D7","7"], ["D8","8"], ["D9","9"], ["D10","10"], ["D11","11"], ["D12","12"], ["D13","13"]]), "PIN")
                .appendField("as")
                .appendField(new Blockly.FieldDropdown([["INPUT","INPUT"], ["OUTPUT","OUTPUT"], ["INPUT_PULLUP","INPUT_PULLUP"]]), "MODE");
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour(210);
            this.setTooltip("Set Arduino digital pin mode");
        }
    };

    Blockly.Blocks['arduino_digital_write'] = {
        init: function() {
            this.appendDummyInput()
                .appendField("digital write")
                .appendField(new Blockly.FieldDropdown([["LED_BUILTIN (13)","13"], ["D2","2"], ["D3","3"], ["D4","4"], ["D5","5"], ["D6","6"], ["D7","7"], ["D8","8"], ["D9","9"], ["D10","10"], ["D11","11"], ["D12","12"], ["D13","13"]]), "PIN")
                .appendField("to")
                .appendField(new Blockly.FieldDropdown([["HIGH","HIGH"], ["LOW","LOW"]]), "VALUE");
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour(210);
        }
    };

    Blockly.Blocks['arduino_digital_read'] = {
        init: function() {
            this.appendDummyInput()
                .appendField("digital read from pin")
                .appendField(new Blockly.FieldDropdown([["D2","2"],["D3","3"],["D4","4"],["D5","5"],["D6","6"],["D7","7"],["D8","8"],["D9","9"],["D10","10"],["D11","11"],["D12","12"],["D13","13"]]), "PIN");
            this.setOutput(true, "Number");
            this.setColour(210);
        }
    };

    // Analog pins category
    Blockly.Blocks['arduino_analog_read'] = {
        init: function() {
            this.appendDummyInput()
                .appendField("analog read")
                .appendField(new Blockly.FieldDropdown([["A0","A0"],["A1","A1"],["A2","A2"],["A3","A3"],["A4","A4"],["A5","A5"]]), "PIN");
            this.setOutput(true, "Number");
            this.setColour(230);
            this.setTooltip("Read analog value 0-1023");
        }
    };

    Blockly.Blocks['arduino_analog_write'] = {
        init: function() {
            this.appendDummyInput()
                .appendField("PWM write (analog) pin")
                .appendField(new Blockly.FieldDropdown([["D3 (PWM)","3"],["D5 (PWM)","5"],["D6 (PWM)","6"],["D9 (PWM)","9"],["D10 (PWM)","10"],["D11 (PWM)","11"]]), "PIN")
                .appendField("value (0-255)")
                .appendField(new Blockly.FieldNumber(128, 0, 255), "VALUE");
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour(230);
        }
    };

    // Delay, Serial print blocks
    Blockly.Blocks['arduino_delay'] = {
        init: function() {
            this.appendValueInput("DELAY_MS")
                .setCheck("Number")
                .appendField("delay (ms)");
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour(290);
        }
    };

    Blockly.Blocks['arduino_serial_print'] = {
        init: function() {
            this.appendValueInput("TEXT")
                .appendField("Serial.print");
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour(260);
        }
    };
    Blockly.Blocks['arduino_serial_println'] = {
        init: function() {
            this.appendValueInput("TEXT")
                .appendField("Serial.println");
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour(260);
        }
    };
    Blockly.Blocks['arduino_serial_begin'] = {
        init: function() {
            this.appendDummyInput()
                .appendField("Serial.begin")
                .appendField(new Blockly.FieldDropdown([["9600","9600"], ["115200","115200"], ["4800","4800"]]), "BAUD");
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour(260);
        }
    };
    // If/else & loop control
    Blockly.Blocks['controls_if'] = {
        init: function() {
            this.appendValueInput("IF0")
                .setCheck("Boolean")
                .appendField("if");
            this.appendStatementInput("DO0")
                .appendField("then");
            this.appendStatementInput("ELSE")
                .appendField("else");
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour(120);
        }
    };
    Blockly.Blocks['logic_compare'] = {
        init: function() {
            var operators = [["=", "=="], ["≠", "!="], ["<", "<"], [">", ">"], ["≤", "<="], ["≥", ">="]];
            this.appendValueInput("A");
            this.appendDummyInput().appendField(new Blockly.FieldDropdown(operators), "OP");
            this.appendValueInput("B");
            this.setOutput(true, "Boolean");
            this.setColour(210);
        }
    };

    // --------------------------------------------------------------
    // 2. GENERATOR FUNCTIONS (Arduino C++ code output)
    // --------------------------------------------------------------
    function arduinoGenerator(block) {
        // pinMode
        if (block.type === 'arduino_pin_mode') {
            var pin = block.getFieldValue('PIN');
            var mode = block.getFieldValue('MODE');
            return `pinMode(${pin}, ${mode});\n`;
        }
        // digitalWrite
        if (block.type === 'arduino_digital_write') {
            var pin = block.getFieldValue('PIN');
            var val = block.getFieldValue('VALUE');
            return `digitalWrite(${pin}, ${val});\n`;
        }
        // digitalRead
        if (block.type === 'arduino_digital_read') {
            var pin = block.getFieldValue('PIN');
            return [`digitalRead(${pin})`, Blockly.Arduino.ORDER_ATOMIC];
        }
        // analogRead
        if (block.type === 'arduino_analog_read') {
            var pin = block.getFieldValue('PIN');
            return [`analogRead(${pin})`, Blockly.Arduino.ORDER_ATOMIC];
        }
        // analogWrite
        if (block.type === 'arduino_analog_write') {
            var pin = block.getFieldValue('PIN');
            var val = block.getFieldValue('VALUE');
            return `analogWrite(${pin}, ${val});\n`;
        }
        // delay
        if (block.type === 'arduino_delay') {
            var delayMs = Blockly.Arduino.valueToCode(block, 'DELAY_MS', Blockly.Arduino.ORDER_ATOMIC) || '0';
            return `delay(${delayMs});\n`;
        }
        // serial begin
        if (block.type === 'arduino_serial_begin') {
            var baud = block.getFieldValue('BAUD');
            return `Serial.begin(${baud});\n`;
        }
        // serial print
        if (block.type === 'arduino_serial_print') {
            var txt = Blockly.Arduino.valueToCode(block, 'TEXT', Blockly.Arduino.ORDER_ATOMIC) || '""';
            return `Serial.print(${txt});\n`;
        }
        if (block.type === 'arduino_serial_println') {
            var txt2 = Blockly.Arduino.valueToCode(block, 'TEXT', Blockly.Arduino.ORDER_ATOMIC) || '""';
            return `Serial.println(${txt2});\n`;
        }
        // if/else
        if (block.type === 'controls_if') {
            var condition = Blockly.Arduino.valueToCode(block, 'IF0', Blockly.Arduino.ORDER_NONE) || 'false';
            var thenBranch = Blockly.Arduino.statementToCode(block, 'DO0');
            var elseBranch = Blockly.Arduino.statementToCode(block, 'ELSE');
            var code = `if (${condition}) {\n${thenBranch}}`;
            if (elseBranch) code += ` else {\n${elseBranch}}`;
            return code + '\n';
        }
        if (block.type === 'logic_compare') {
            var a = Blockly.Arduino.valueToCode(block, 'A', Blockly.Arduino.ORDER_RELATIONAL);
            var b = Blockly.Arduino.valueToCode(block, 'B', Blockly.Arduino.ORDER_RELATIONAL);
            var op = block.getFieldValue('OP');
            return [`${a} ${op} ${b}`, Blockly.Arduino.ORDER_RELATIONAL];
        }
        return '';
    }
    Blockly.Arduino.addReservedWords('setup,loop');
    for (let type in Blockly.Blocks) {
        if (Blockly.Blocks[type] && typeof Blockly.Arduino[type] === 'undefined') {
            Blockly.Arduino[type] = arduinoGenerator;
        }
    }

    // Override standard generator mapping
    Blockly.Arduino['arduino_pin_mode'] = arduinoGenerator;
    Blockly.Arduino['arduino_digital_write'] = arduinoGenerator;
    Blockly.Arduino['arduino_digital_read'] = arduinoGenerator;
    Blockly.Arduino['arduino_analog_read'] = arduinoGenerator;
    Blockly.Arduino['arduino_analog_write'] = arduinoGenerator;
    Blockly.Arduino['arduino_delay'] = arduinoGenerator;
    Blockly.Arduino['arduino_serial_begin'] = arduinoGenerator;
    Blockly.Arduino['arduino_serial_print'] = arduinoGenerator;
    Blockly.Arduino['arduino_serial_println'] = arduinoGenerator;
    Blockly.Arduino['controls_if'] = arduinoGenerator;
    Blockly.Arduino['logic_compare'] = arduinoGenerator;

    // --------------------------------------------------------------
    // 3. INIT BLOCKLY WORKSPACE
    // --------------------------------------------------------------
    const workspace = Blockly.inject('blocklyDiv', {
        toolbox: `
        <xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none;">
            <category name="📌 Pins & Modes" colour="210">
                <block type="arduino_pin_mode"></block>
                <block type="arduino_digital_write"></block>
                <block type="arduino_digital_read"></block>
            </category>
            <category name="📊 Analog / PWM" colour="230">
                <block type="arduino_analog_read"></block>
                <block type="arduino_analog_write"></block>
            </category>
            <category name="⏱️ Control & Time" colour="290">
                <block type="arduino_delay"></block>
                <block type="controls_if"></block>
                <block type="logic_compare"></block>
            </category>
            <category name="💬 Serial Monitor" colour="260">
                <block type="arduino_serial_begin"></block>
                <block type="arduino_serial_print"></block>
                <block type="arduino_serial_println"></block>
            </category>
        </xml>`,
        grid: { spacing: 20, length: 3, colour: '#2f3147' },
        zoom: { controls: true, wheel: true },
        trashcan: true,
        theme: Blockly.Themes.Classic,
    });

    // Default starter example: LED blink + serial
    var demoXml = `<xml xmlns="http://www.w3.org/1999/xhtml">
        <block type="arduino_pin_mode" x="100" y="70">
            <field name="PIN">13</field><field name="MODE">OUTPUT</field>
            <next><block type="arduino_serial_begin"><field name="BAUD">9600</field>
            <next><block type="controls_if"><value name="IF0"><block type="logic_compare"><field name="OP">=</field><value name="A"><block type="arduino_digital_read"><field name="PIN">2</field></block></value><value name="B"><block type="math_number"><field name="NUM">1</field></block></value></block></value>
            <statement name="DO0"><block type="arduino_digital_write"><field name="PIN">13</field><field name="VALUE">HIGH</field><next><block type="arduino_serial_println"><value name="TEXT"><block type="text"><field name="TEXT">Button pressed</field></block></value></block></next></block></statement>
            <statement name="ELSE"><block type="arduino_digital_write"><field name="PIN">13</field><field name="VALUE">LOW</field></block></statement>
            <next><block type="arduino_delay"><value name="DELAY_MS"><block type="math_number"><field name="NUM">100</field></block></value></block></next></block></next></block></next></block>
    </xml>`;
    Blockly.Xml.domToWorkspace(Blockly.Xml.textToDom(demoXml), workspace);

    // --------------------------------------------------------------
    // 4. COMPILE & GENERATE ARDUINO SKETCH (simulate arduino-cli)
    // --------------------------------------------------------------
    function logToConsole(message, type = 'info') {
        const consoleDiv = document.getElementById('consoleOutput');
        const line = document.createElement('div');
        line.className = `log-line log-${type}`;
        line.innerHTML = `<i class="fas ${type === 'error' ? 'fa-times-circle' : (type === 'success' ? 'fa-check-circle' : 'fa-info-circle')}"></i> ${message}`;
        consoleDiv.appendChild(line);
        line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function clearConsole() {
        document.getElementById('consoleOutput').innerHTML = '';
        logToConsole('Console cleared. Ready for new compilation.', 'info');
    }

    function generateArduinoCode() {
        try {
            let code = Blockly.Arduino.workspaceToCode(workspace);
            let fullSketch = `// Auto-generated Arduino Sketch for UNO\nvoid setup() {\n${code.split('void loop')[0] || ''}}\n\nvoid loop() {\n${code.includes('void loop') ? code.split('void loop')[1] : code}}\n`;
            if (!fullSketch.includes('setup')) fullSketch = `void setup() {\n  pinMode(LED_BUILTIN, OUTPUT);\n  Serial.begin(9600);\n}\nvoid loop() {\n  digitalWrite(LED_BUILTIN, HIGH); delay(1000); digitalWrite(LED_BUILTIN, LOW); delay(1000);\n}`;
            return fullSketch;
        } catch(e) { logToConsole(`Code gen error: ${e.message}`, 'error'); return null; }
    }

    // Compile simulation using actual arduino-cli (requires local installation)
    async function compileSketch() {
        document.getElementById('compileStatusBadge').innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Compiling...';
        logToConsole('🔨 Compiling Arduino sketch with arduino-cli...', 'info');
        const sketchCode = generateArduinoCode();
        if (!sketchCode) { updateCompileBadge('Compile Failed'); return false; }
        
        // Write file via File System Access API or fallback to simulated compile
        // Since browser cannot invoke arduino-cli directly, we simulate but provide full instructions + download .ino
        logToConsole('📝 Generated Arduino code (Uno compatible): \n```cpp\n' + sketchCode.substring(0, 500) + '...\n```', 'info');
        logToConsole('⚠️ For real compilation: Save the .ino file and run: arduino-cli compile --fqbn arduino:avr:uno /path/to/sketch', 'info');
        
        // Offer download
        const blob = new Blob([sketchCode], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'mblock_sketch.ino';
        a.click();
        URL.revokeObjectURL(a.href);
        logToConsole('✅ Sketch saved as "mblock_sketch.ino". Compile with arduino-cli or Arduino IDE.', 'success');
        updateCompileBadge('Compiled (Downloaded)');
        return true;
    }

    function updateCompileBadge(text) { document.getElementById('compileStatusBadge').innerHTML = text; }

    // --------------------------------------------------------------
    // 5. SERIAL / COM PORT CONNECTION (Web Serial API) for actual upload
    // --------------------------------------------------------------
    let selectedPort = null;
    let portReader = null;

    async function listSerialPorts() {
        try {
            const ports = await navigator.serial.getPorts();
            const select = document.getElementById('portSelect');
            select.innerHTML = '';
            if (ports.length === 0) {
                const opt = document.createElement('option');
                opt.text = 'No paired ports — click request';
                select.appendChild(opt);
            }
            for (const port of ports) {
                const opt = document.createElement('option');
                opt.value = port;
                opt.text = port.getInfo ? JSON.stringify(port.getInfo()) : 'Paired COM Device';
                select.appendChild(opt);
            }
            if (ports.length > 0) {
                document.getElementById('portLed').classList.add('active');
                document.getElementById('portLabel').innerText = 'Port Ready';
            } else {
                document.getElementById('portLed').classList.remove('active');
                document.getElementById('portLabel').innerText = 'No Port';
            }
        } catch(e) { logToConsole(`Port listing error: ${e}`, 'error'); }
    }

    async function requestPort() {
        try {
            const port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            selectedPort = port;
            document.getElementById('portLed').classList.add('active');
            document.getElementById('portLabel').innerText = 'Connected via WebSerial';
            logToConsole(`🔌 COM Port connected (${port.getInfo?.usbVendorId || 'USB'})`, 'success');
            await listSerialPorts();
        } catch(err) { logToConsole(`Port request failed: ${err.message}`, 'error'); }
    }

    async function uploadToPort() {
        if (!selectedPort) {
            logToConsole('❌ No COM port selected. Click "Refresh Ports" then request port via browser prompt.', 'error');
            await requestPort();
            if (!selectedPort) return;
        }
        logToConsole('⬆️ Upload ready: Please compile first, then use manual upload via Arduino CLI.\nFor WebSerial upload: we send raw compiled binary? Requires .hex. Use arduino-cli upload -p PORT --fqbn arduino:avr:uno', 'info');
        logToConsole('💡 Suggestion: After compilation, run: arduino-cli upload -p ' + (selectedPort?.getInfo?.usbProductId || 'COMx') + ' --fqbn arduino:avr:uno ./mblock_sketch.ino', 'info');
        const fakeUpload = document.createElement('div');
        fakeUpload.className = 'log-line log-success';
        fakeUpload.innerHTML = '✅ Upload simulation: connect your Arduino Uno, use Arduino CLI with the downloaded .ino file.';
        document.getElementById('consoleOutput').appendChild(fakeUpload);
    }

    // --------------------------------------------------------------
    // 6. EVENT LISTENERS
    // --------------------------------------------------------------
    document.getElementById('compileBtn').addEventListener('click', async () => { await compileSketch(); });
    document.getElementById('uploadBtn').addEventListener('click', uploadToPort);
    document.getElementById('clearConsoleBtn').addEventListener('click', clearConsole);
    document.getElementById('refreshPortsBtn').addEventListener('click', async () => { await listSerialPorts(); await requestPort(); });
    
    window.addEventListener('load', () => {
        listSerialPorts();
