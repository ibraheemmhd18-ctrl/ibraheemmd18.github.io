<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Working mBlock ARDUINO IDE</title>
<script src="https://unpkg.com/blockly/blockly.min.js"></script>
<style>
body{
margin:0;
font-family:Arial;
background:#1e1e1e;
color:white;
overflow:hidden;
}
#topbar{
height:60px;
background:#2d2d2d;
display:flex;
align-items:center;
padding:10px;
gap:10px;
}
button{
padding:10px;
border:none;
border-radius:8px;
background:#00aaff;
color:white;
font-weight:bold;
cursor:pointer;
}
#main{
display:flex;
height:calc(100vh - 60px);
}
#blocklyDiv{
height:100%;
width:70%;
background:white;
}
#rightPanel{
width:30%;
background:#111;
padding:10px;
overflow:auto;
}
textarea{
width:100%;
height:300px;
background:black;
color:#00ff00;
padding:10px;
}
#serialMonitor{
height:200px;
overflow:auto;
background:black;
padding:10px;
color:#00ff00;
margin-bottom:10px;
}
input{
width:100%;
padding:10px;
margin-top:10px;
}
</style>
</head>
<body>

<div id="topbar">
<button onclick="connectSerial()">Connect COM</button>
<button onclick="generateCode()">Generate Code</button>
<button onclick="uploadCode()">Upload</button>
<button onclick="toggleLiveMode()">Live Mode</button>
</div>

<div id="main">
<div id="blocklyDiv"></div>

<div id="rightPanel">
<h2>Arduino Code</h2>
<textarea id="codeArea"></textarea>

<h2>Serial Monitor</h2>
<div id="serialMonitor"></div>

<input id="serialInput" placeholder="Send Serial Text">
<button onclick="sendSerial()">Send</button>
</div>
</div>

<xml id="toolbox" style="display:none">

<category name="Control" colour="120">
<block type="controls_repeat_ext"></block>
<block type="controls_whileUntil"></block>
<block type="controls_if"></block>
</category>

<category name="Math" colour="230">
<block type="math_number"></block>
</category>

<category name="Text" colour="160">
<block type="text"></block>
</category>

<category name="Arduino" colour="20">
<block type="arduino_start"></block>
<block type="digital_write"></block>
<block type="analog_read"></block>
<block type="servo_write"></block>
<block type="ultrasonic_read"></block>
<block type="serial_print"></block>
</category>

<category name="Live Mode" colour="300">
<block type="live_key"></block>
</category>

</xml>

<script>
const workspace = Blockly.inject('blocklyDiv',{
toolbox:document.getElementById('toolbox')
});

Blockly.Blocks['arduino_start']={
init:function(){
this.appendDummyInput().appendField('when Arduino starts');
this.setNextStatement(true);
this.setColour(20);
}
};

Blockly.Blocks['digital_write']={
init:function(){
this.appendDummyInput()
.appendField('digital write pin')
.appendField(new Blockly.FieldNumber(13), 'PIN')
.appendField('HIGH');
this.setPreviousStatement(true);
this.setNextStatement(true);
this.setColour(20);
}
};

Blockly.Blocks['analog_read']={
init:function(){
this.appendDummyInput()
.appendField('analog read A0');
this.setOutput(true,'Number');
this.setColour(20);
}
};

Blockly.Blocks['servo_write']={
init:function(){
this.appendDummyInput()
.appendField('servo pin')
.appendField(new Blockly.FieldNumber(9),'PIN')
.appendField('angle')
.appendField(new Blockly.FieldNumber(90),'ANGLE');
this.setPreviousStatement(true);
this.setNextStatement(true);
this.setColour(20);
}
};

Blockly.Blocks['ultrasonic_read']={
init:function(){
this.appendDummyInput()
.appendField('ultrasonic distance');
this.setOutput(true,'Number');
this.setColour(20);
}
};

Blockly.Blocks['serial_print']={
init:function(){
this.appendValueInput('TEXT')
.appendField('Serial Print');
this.setPreviousStatement(true);
this.setNextStatement(true);
this.setColour(20);
}
};

Blockly.Blocks['live_key']={
init:function(){
this.appendDummyInput()
.appendField('when SPACE key pressed');
this.setNextStatement(true);
this.setColour(300);
}
};

Blockly.JavaScript['arduino_start']=function(block){
return 'void setup(){\nSerial.begin(9600);\n}\n\nvoid loop(){\n';
};

Blockly.JavaScript['digital_write']=function(block){
const pin=block.getFieldValue('PIN');
return `digitalWrite(${pin}, HIGH);\n`;
};

Blockly.JavaScript['analog_read']=function(block){
return ['analogRead(A0)', Blockly.JavaScript.ORDER_NONE];
};

Blockly.JavaScript['servo_write']=function(block){
const angle=block.getFieldValue('ANGLE');
return `servo.write(${angle});\n`;
};

Blockly.JavaScript['ultrasonic_read']=function(block){
return ['20', Blockly.JavaScript.ORDER_NONE];
};

Blockly.JavaScript['serial_print']=function(block){
const text=Blockly.JavaScript.valueToCode(block,'TEXT',Blockly.JavaScript.ORDER_NONE)||'"Hello"';
return `Serial.println(${text});\n`;
};

Blockly.JavaScript['live_key']=function(block){
return '// live key pressed\n';
};

async function connectSerial(){
try{
window.port = await navigator.serial.requestPort();
await port.open({ baudRate:9600 });
addSerial('Connected to Arduino');
readSerial();
}catch(e){
alert(e);
}
}

async function readSerial(){
while(port.readable){
const reader = port.readable.getReader();
try{
while(true){
const {value,done}=await reader.read();
if(done) break;
const text = new TextDecoder().decode(value);
addSerial(text);
}
}catch(e){
console.log(e);
}finally{
reader.releaseLock();
}
}
}

function addSerial(text){
const div=document.getElementById('serialMonitor');
div.innerHTML += text + '<br>';
div.scrollTop=div.scrollHeight;
}

async function sendSerial(){
const text=document.getElementById('serialInput').value;
const writer=port.writable.getWriter();
await writer.write(new TextEncoder().encode(text+'\n'));
writer.releaseLock();
}

function generateCode(){
let code=Blockly.JavaScript.workspaceToCode(workspace);
code += '\n}';
document.getElementById('codeArea').value=code;
}

function toggleLiveMode(){
alert('Live mode toggled');
}

async function uploadCode(){
const code=document.getElementById('codeArea').value;
alert('Upload system needs Node.js backend + Arduino CLI');
console.log(code);
}
</script>

</body>
</html>
