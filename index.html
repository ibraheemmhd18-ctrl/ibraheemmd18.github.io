<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arduino Block IDE STYLE</title>   																																		

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:#0f0;
}

/* TOP BAR */
#topbar{
  display:flex;
  gap:10px;
  padding:10px;
  background:#222;
  align-items:center;
}

/* MAIN LAYOUT */
#container{
  display:flex;
  height:90vh;
}

/* TOOLBOX */
#toolbox{
  width:20%;
  background:#000;
  padding:10px;
}

/* WORKSPACE */
#workspace{
  width:60%;
  background:#1a1a1a;
  padding:10px;
}

/* PANEL */
#panel{
  width:20%;
  background:#111;
  padding:10px;
}

/* BLOCK CATEGORIES */
.category{
  padding:8px;
  margin:5px 0;
  background:#333;
  cursor:pointer;
}

/* BUTTONS */
button{
  padding:8px;
  cursor:pointer;
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div id="topbar">

<button>Live Mode</button>
<button>Upload Mode</button>
<button>Connect COM</button>
<button>Upload</button>

<span>MODE: LIVE</span>

</div>

<!-- MAIN -->
<div id="container">

<!-- TOOLBOX -->
<div id="toolbox">

<div class="category">Control</div>
<div class="category">Pins</div>
<div class="category">Output</div>
<div class="category">Serial</div>

</div>

<!-- WORKSPACE -->
<div id="workspace">

<h3>Block Workspace</h3>

<div style="border:1px solid #0f0;height:80%;"></div>

</div>

<!-- PANEL -->
<div id="panel">

<h3>Serial Monitor</h3>

<div style="background:#000;height:150px;"></div>

<h3>Live Camera</h3>

<div style="background:#333;height:150px;"></div>

</div>

</div>

</body>
</html>
