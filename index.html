<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Full Arduino Blockly IDE</title>

<script src="https://unpkg.com/blockly/blockly.min.js"></script>

<style>
body { margin:0; font-family:Arial; }

#topbar{
  height:50px;
  background:#2c313c;
  color:white;
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px;
}

button{
  background:#4C97FF;
  border:none;
  color:white;
  padding:6px 10px;
  cursor:pointer;
  border-radius:5px;
}

#blocklyDiv{
  height:calc(100vh - 50px);
  width:70%;
  float:left;
}

#side{
  width:30%;
  float:right;
  height:calc(100vh - 50px);
  background:#111;
  color:#0f0;
  padding:10px;
  box-sizing:border-box;
}

textarea{
  width:100%;
  height:90%;
  background:#000;
  color:#0f0;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div id="topbar">
<button onclick="generateCode()">Generate</button>
<button onclick="connectArduino()">Connect</button>
<button onclick="disconnectArduino()">Disconnect</button>
<button onclick="uploadCode()">Upload</button>
<span id="status">Disconnected</span>
</div>

<!-- BLOCKLY -->
<div id="blocklyDiv"></div>

<!-- CODE -->
<div id="side">
<textarea id="code"></textarea>
</div>

<script>

/* ================= TOOLBOX (FULL FIXED) ================= */

const toolbox = {
"kind":"categoryToolbox",
"contents":[

{
"kind":"category",
"name":"Events",
"colour":"#FFD500",
"contents":[
{"kind":"block","type":"arduino_start"}
]
},

{
"kind":"category",
"name":"Pins",
"colour":"#4C97FF",
"contents":[
{"kind":"block","type":"digital_write"},
{"kind":"block","type":"digital_read"},
{"kind":"block","type":"analog_read"},
{"kind":"block","type":"servo_write"}
]
},

{
"kind":"category",
"name":"Serial",
"colour":"#2ECC71",
"contents":[
{"kind":"block","type":"serial_print"}
]
},

{
"kind":"category",
"name":"Sensor",
"colour":"#5DADE2",
"contents":[
{"kind":"block","type":"ultrasonic_sensor"}
]
},

{
"kind":"category",
"name":"Control",
"colour":"#FFAB19",
"contents":[
{"kind":"block","type":"controls_if"},
{"kind":"block","type":"controls_repeat_ext"},
{"kind":"block","type":"controls_whileUntil"}
]
},

{
"kind":"category",
"name":"Operators",
"colour":"#40BF4A",
"contents":[
{"kind":"block","type":"math_number"},
{"kind":"block","type":"math_arithmetic"},
{"kind":"block","type":"logic_compare"},
{"kind":"block","type":"text"}
]
},

{
"kind":"category",
"name":"Variables",
"colour":"#FF8C1A",
"custom":"VARIABLE"
},

{
"kind":"category",
"name":"My Blocks",
"colour":"#FF6680",
"custom":"PROCEDURE"
}

]
};

/* ================= WORKSPACE (IMPORTANT ORDER FIX) ================= */

let workspace;

/* ================= INIT ================= */

workspace = Blockly.inject('blocklyDiv',{
toolbox:toolbox,
trashcan:true,
scrollbars:true
});

/* ================= BLOCKS ================= */

Blockly.Blocks['arduino_start'] = {
init:function(){
this.appendDummyInput()
.appendField("When Arduino starts");
this.setNextStatement(true);
this.setColour("#FFD500");
}
};

Blockly.Blocks['digital_write'] = {
init:function(){
this.appendDummyInput()
.appendField("Digital Pin")
.appendField(new Blockly.FieldDropdown([["2","2"],["3","3"],["4","4"],["5","5"]]),"PIN")
.appendField("set")
.appendField(new Blockly.FieldDropdown([["HIGH","HIGH"],["LOW","LOW"]]),"STATE");
this.setPreviousStatement(true);
this.setNextStatement(true);
this.setColour("#4C97FF");
}
};

Blockly.Blocks['digital_read'] = {
init:function(){
this.appendDummyInput()
.appendField("Read Digital Pin")
.appendField(new Blockly.FieldDropdown([["2","2"],["3","3"],["4","4"]]),"PIN");
this.setOutput(true);
this.setColour("#4C97FF");
}
};

Blockly.Blocks['analog_read'] = {
init:function(){
this.appendDummyInput()
.appendField("Analog Pin")
.appendField(new Blockly.FieldDropdown([["A0","A0"],["A1","A1"],["A2","A2"]]),"PIN");
this.setOutput(true);
this.setColour("#4C97FF");
}
};

Blockly.Blocks['servo_write'] = {
init:function(){
this.appendDummyInput()
.appendField("Servo Pin")
.appendField(new Blockly.FieldDropdown([["3","3"],["5","5"],["9","9"]]),"PIN")
.appendField("Angle")
.appendField(new Blockly.FieldDropdown([["0","0"],["90","90"],["180","180"]]),"ANGLE");
this.setPreviousStatement(true);
this.setNextStatement(true);
this.setColour("#4C97FF");
}
};

Blockly.Blocks['serial_print'] = {
init:function(){
this.appendValueInput("TEXT")
.appendField("Serial Print");
this.setPreviousStatement(true);
this.setNextStatement(true);
this.setColour("#2ECC71");
}
};

Blockly.Blocks['ultrasonic_sensor'] = {
init:function(){
this.appendDummyInput()
.appendField("Ultrasonic trig")
.appendField(new Blockly.FieldDropdown([["2","2"],["3","3"],["4","4"]]),"TRIG")
.appendField("echo")
.appendField(new Blockly.FieldDropdown([["5","5"],["6","6"],["7","7"]]),"ECHO");
this.setOutput(true);
this.setColour("#5DADE2");
}
};

/* ================= CODE GENERATOR ================= */

function generateCode(){
let code = `
void setup(){
Serial.begin(9600);
}

void loop(){

}
`;
document.getElementById("code").value = code;
}

/* ================= SERIAL ================= */

let port;
let writer;

async function connectArduino(){
port = await navigator.serial.requestPort();
await port.open({baudRate:9600});
writer = port.writable.getWriter();
document.getElementById("status").innerText="Connected";
}

async function disconnectArduino(){
if(writer) writer.releaseLock();
if(port) await port.close();
document.getElementById("status").innerText="Disconnected";
}

/* ================= UPLOAD (BACKEND READY) ================= */

function uploadCode(){

let code = document.getElementById("code").value;

fetch("http://localhost:3000/upload",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({code})
});

alert("Sent to upload server 😎🔥");
}

</script>

</body>
</html>
