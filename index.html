<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arduino Block IDE FIXED</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:#0f0;
}

#topbar{
  display:flex;
  gap:10px;
  padding:10px;
  background:#222;
}

#container{
  display:flex;
  height:90vh;
}

/* TOOLBOX */
#toolbox{
  width:20%;
  background:#000;
  padding:10px;
}

.category{
  padding:10px;
  background:#333;
  margin:5px 0;
  cursor:pointer;
}

/* BLOCK LIST */
.blockList{
  display:none;
  padding-left:10px;
}

.block{
  background:#555;
  padding:5px;
  margin:5px 0;
  cursor:pointer;
}

/* WORKSPACE */
#workspace{
  width:60%;
  background:#1a1a1a;
  padding:10px;
}

/* PANEL */
#panel{
  width:20%;
  background:#111;
  padding:10px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div id="topbar">
<button onclick="setLive()">Live</button>
<button onclick="setUpload()">Upload</button>
<button onclick="connectCOM()">Connect COM</button>
<button onclick="upload()">Upload Code</button>
<span id="mode">LIVE MODE</span>
</div>

<!-- MAIN -->
<div id="container">

<!-- TOOLBOX -->
<div id="toolbox">

<div class="category" onclick="toggle('control')">Control</div>
<div id="control" class="blockList">
<div class="block">forever</div>
<div class="block">repeat 10</div>
</div>

<div class="category" onclick="toggle('pins')">Pins</div>
<div id="pins" class="blockList">
<div class="block">digital read</div>
<div class="block">analog read</div>
</div>

<div class="category" onclick="toggle('output')">Output</div>
<div id="output" class="blockList">
<div class="block">PWM write</div>
</div>

<div class="category" onclick="toggle('serial')">Serial</div>
<div id="serial" class="blockList">
<div class="block">serial print hello</div>
</div>

</div>

<!-- WORKSPACE -->
<div id="workspace">
<h3>Workspace</h3>
<div style="border:1px solid #0f0;height:80%;"></div>
</div>

<!-- PANEL -->
<div id="panel">
<h3>Serial</h3>
<div style="background:#000;height:150px;"></div>
</div>

</div>

<script>

// ================= CATEGORY TOGGLE =================
function toggle(id){
  let el = document.getElementById(id);
  el.style.display = (el.style.display === "block") ? "none" : "block";
}

// ================= MODE =================
let mode = "LIVE";

function setLive(){
  mode = "LIVE";
  document.getElementById("mode").innerText = "LIVE MODE";
}

function setUpload(){
  mode = "UPLOAD";
  document.getElementById("mode").innerText = "UPLOAD MODE";
}

// ================= COM CONNECT (WORKS IN CHROME) =================
async function connectCOM(){
  try{
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate:9600 });
    alert("COM CONNECTED ✔");
  }catch(e){
    alert("COM NOT CONNECTED");
  }
}

// ================= UPLOAD PLACEHOLDER =================
function upload(){
  alert("Upload ready (backend needed with Arduino CLI)");
}

</script>

</body>
</html>
